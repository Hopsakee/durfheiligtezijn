[project]
name = "durfheilig"
version = "0.1.0"
description = "Welkomstspel: koppel elke deelnemer aan een heilige en raad samen wie bij wie hoort."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastlite>=0.2.4",
    "httpx>=0.28.1",
    "python-fasthtml>=0.14.12",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durfheilig"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Linux (server, box) and macOS (Jelle's Mac). uv.lock must be made against PyPI, on the Mac:
# the offline box can only lock Linux and writes /opt/wheels paths into the lock, which the
# Docker build on the server cannot use (the Dockerfile refuses such a lock). In the box, run
# `uv run --frozen ...` so uv does not try to re-lock.
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
